name: Cleanup bad PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  close-pr:
    if: github.repository == 'mmistakes/minimal-mistakes'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true
          sparse-checkout: |
            _config.yml
      - id: config
        shell: ruby {0}
        run: |
          require "yaml"

          config = YAML.safe_load(File.read("_config.yml"), aliases: true) || {}
          customized = !config.fetch("url", nil).nil?
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |file|
            file.puts("customized=#{customized}")
          end
      - uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
        if: steps.config.outputs.customized == 'false'
        with:
          labels: |
            Type: Invalid
            Type: Spam
      - uses: superbrothers/close-pull-request@9c18513d320d7b2c7185fb93396d0c664d5d8448 # v3.1.2
        if: steps.config.outputs.customized == 'false'
        with:
          # Optional. Post an issue comment just before closing a pull request.
          comment: |
            **You have created a Pull Request to the wrong repository.** This is the repository for [Minimal Mistakes][1], the free Jekyll theme. See [GitHub Docs: About pull requests][2] if you need help.

              [1]: https://mmistakes.github.io/minimal-mistakes/
              [2]: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests
      - uses: sudo-bot/action-pull-request-lock@e20c54d0f068b0b2cf3b345e0585c10ac5d5415a # v2
        if: steps.config.outputs.customized == 'false'
        with:
          github-token: ${{ github.token }}
          number: ${{ github.event.pull_request.number }}
          lock-reason: spam
